# Builds an unsigned Sdab.ipa on GitHub's Mac machines.
# Sign and install it with Sideloadly, AltStore or SideStore (see README).
name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Sdab.xcodeproj \
            -scheme Sdab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | tee xcodebuild.log | grep -E "error:|warning: .*Sdab/|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Sdab.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Sdab.app Payload/
          zip -qry Sdab.ipa Payload
          ls -lh Sdab.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sdab-ipa
          path: Sdab.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Attach IPA to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Sdab.ipa
